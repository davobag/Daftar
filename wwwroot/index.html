<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ثبت سند · دفتر روزنامه</title>
<link rel="stylesheet" href="/css/fonts.css">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="wrap" id="appView" hidden>
  <header id="appHeader"></header>
  <div class="grid">
    <section class="panel" aria-labelledby="formTitle">
      <h2 id="formTitle">ثبت سند جدید</h2>
      <form id="entryForm" novalidate>
        <div id="editNote" class="editing-note" hidden>در حال ویرایش سند. <button type="button" class="small" id="cancelEdit">انصراف</button></div>
        <label>تاریخ (شمسی)
          <input id="fDate" class="num" placeholder="۱۴۰۵/۰۸/۱۳" inputmode="numeric" autocomplete="off">
        </label>
        <label>حساب / شخص
          <div class="picker">
            <input id="fAccount" placeholder="کد حساب را بزنید یا نام را بنویسید" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="acctSuggest">
            <ul id="acctSuggest" class="suggest" role="listbox" hidden></ul>
          </div>
          <span class="hint" id="acctHint"></span>
        </label>
        <div class="row2">
          <label><span>بدهکار (<span class="inUnit">تومان</span>)</span>
            <input id="fDebit" class="num" inputmode="numeric" placeholder="۰" autocomplete="off">
          </label>
          <label><span>بستانکار (<span class="inUnit">تومان</span>)</span>
            <input id="fCredit" class="num" inputmode="numeric" placeholder="۰" autocomplete="off">
          </label>
        </div>
        <div class="hint" id="rialHint"></div>
        <label>روش پرداخت
          <select id="fMethod">
            <option>نقدی</option>
            <option>کارت به کارت</option>
            <option>کارتخوان</option>
            <option>انتقال بانکی (پایا/ساتنا)</option>
            <option>چک</option>
            <option>سایر</option>
          </select>
        </label>
        <label>توضیحات
          <textarea id="fDesc" placeholder="مثلاً: خرید میوه از بازار"></textarea>
        </label>
        <div class="err" id="formErr" role="alert"></div>
        <div class="btns">
          <button type="submit" class="primary" id="saveBtn">ثبت سند</button>
        </div>
      </form>
    </section>

    <section class="panel" aria-labelledby="recentTitle">
      <h2 id="recentTitle">سندهای اخیر <a class="unit" href="/report">گزارش کامل ←</a></h2>
      <div class="table-scroll">
        <table>
          <thead><tr><th>تاریخ</th><th>حساب</th><th class="amt">بدهکار</th><th class="amt">بستانکار</th><th>روش</th><th>توضیحات</th><th></th></tr></thead>
          <tbody id="recentBody"></tbody>
        </table>
      </div>
      <div class="hint">مبالغ به <span class="outUnit">ریال</span>. ۲۰ سند آخر بر اساس زمان ثبت.</div>
    </section>
  </div>
</div>
<script src="/js/common.js"></script>
<script src="/js/entry.js"></script>
</body>
</html>
