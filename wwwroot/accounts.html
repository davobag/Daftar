<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>حساب‌ها · دفتر روزنامه</title>
<link rel="stylesheet" href="/css/fonts.css">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="wrap" id="appView" hidden>
  <header id="appHeader"></header>
  <section class="panel" aria-labelledby="accountsTitle">
    <h2 id="accountsTitle">حساب‌ها و کدها</h2>
    <form id="accountForm" class="acct-form" novalidate>
      <label>کد <input id="aCode" class="num" inputmode="numeric" placeholder="خودکار" autocomplete="off"></label>
      <label>زیرمجموعه‌ی <select id="aParent"></select></label>
      <label>نام حساب یا شخص <input id="aName" placeholder="مثلاً: خرید کاغذ" autocomplete="off"></label>
      <button type="submit" class="primary" id="aSave">افزودن حساب</button>
      <button type="button" id="aCancel" hidden>انصراف</button>
    </form>
    <p class="sub-hint">کد زیرحساب خودکار از کد حساب اصلی ساخته می‌شود (۱۰۲ ← ۱۰۲۰۱).</p>
    <div class="err" id="accountErr" role="alert"></div>
    <div class="table-scroll">
      <table>
        <thead><tr><th class="amt">کد</th><th>نام</th><th></th></tr></thead>
        <tbody id="accountsBody"></tbody>
      </table>
    </div>
  </section>
</div>
<script src="/js/common.js"></script>
<script src="/js/accounts.js"></script>
</body>
</html>
